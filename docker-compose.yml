version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mcq_platform
      POSTGRES_USER: mcq_user
      POSTGRES_PASSWORD: mcq_password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: mcq_user
      RABBITMQ_DEFAULT_PASS: mcq_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 mcq_platform.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://mcq_user:mcq_password@db:5432/mcq_platform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://mcq_user:mcq_password@rabbitmq:5672//

  celery:
    build: .
    command: celery -A mcq_platform worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://mcq_user:mcq_password@db:5432/mcq_platform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://mcq_user:mcq_password@rabbitmq:5672//

  celery-beat:
    build: .
    command: celery -A mcq_platform beat -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://mcq_user:mcq_password@db:5432/mcq_platform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://mcq_user:mcq_password@rabbitmq:5672//

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  static_volume:
  media_volume: